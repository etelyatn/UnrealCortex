[project]
name = "cortex-mcp"
version = "0.2.10"
description = "MCP server for UnrealCortex - AI-powered Unreal Engine development"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x renamed FastMCP; a fresh non-locked install would otherwise fail to import.
    "mcp>=1.26.0,<2",
    "psutil>=5.9",
]

[project.scripts]
cortex-mcp = "cortex_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# server.py and the composites import the top-level `tools` package from src/.
packages = ["src/cortex_mcp", "src/tools"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "anyio[trio]>=4.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: requires running Unreal Editor",
    "scenario: multi-step MCP workflow tests (live scenarios also carry e2e)",
    "stress: long-running performance tests",
]
